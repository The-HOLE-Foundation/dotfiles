name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ── Linux: profile verification matrix ──────────────────────────────────────
  # Each leg builds Dockerfile.test with CHEZMOI_PROJECT=<key> baked in (via
  # scripts/test-profile.sh) and asserts the binaries declared in the matching
  # docs/profiles/<key>.md are on PATH. `core` is the baseline (no per-profile
  # doc, no asserts — just exercises the no-project build path).
  #
  # Adding a profile leg here is gated on having a corresponding
  # docs/profiles/<key>.md — see docs/profiles/README.md#verification.
  profiles:
    name: profile / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [core, legal, godocs, oversight]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pre-build with GHA cache backend + load into the local Docker daemon.
      # test-profile.sh's own `docker build` invocation (legacy daemon builder)
      # then hits the just-loaded image layers and is effectively a no-op
      # rebuild before its assertion phase. Shared scope across profile keys
      # because the early apt / Tailscale / chezmoi-init layers are identical
      # across profiles — only the CHEZMOI_PROJECT-aware tail diverges.
      - name: Pre-warm BuildKit cache (load image into daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: dotfiles-test:${{ matrix.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CHEZMOI_BRANCH=${{ github.head_ref || github.ref_name }}
            CHEZMOI_PROJECT=${{ matrix.profile == 'core' && '' || matrix.profile }}

      - name: Verify profile via scripts/test-profile.sh
        run: |
          scripts/test-profile.sh \
            --project "${{ matrix.profile }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --keep-images

      # Only the `core` leg publishes to GHCR, and only on push to main.
      - name: Login to GHCR
        if: matrix.profile == 'core' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push core image to GHCR
        if: matrix.profile == 'core' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          push: true
          tags: |
            ghcr.io/jobikinobi/dotfiles:latest
            ghcr.io/jobikinobi/dotfiles:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CHEZMOI_BRANCH=main
            CHEZMOI_PROJECT=

  # ── RHEL: verify chezmoi apply succeeds on RHEL-family (Rocky Linux 9) ─────
  # Rocky Linux is glibc-based, so Homebrew (Linuxbrew) is available and the
  # full brew-based install path runs — unlike Alpine. This job confirms that
  # the unified Linux bootstrap correctly detects the rhel OS family and that
  # the dnf prereqs + Homebrew + Brewfile.core all succeed.
  rhel:
    name: rhel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build RHEL image (Rocky Linux 9)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rhel
          load: true
          tags: dotfiles-rhel:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CHEZMOI_BRANCH=${{ github.head_ref || github.ref_name }}

      - name: Verify core tools available on RHEL
        run: |
          docker run --rm dotfiles-rhel:test \
            su - jth -s /bin/bash -c '
              set -e
              # Ensure Linuxbrew is on PATH
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true
              echo "=== Verifying RHEL core tools ==="
              for tool in zsh git curl jq fzf bat rg; do
                if command -v "$tool" >/dev/null 2>&1; then
                  echo "✓ $tool ($(command -v $tool))"
                else
                  echo "✗ $tool MISSING" && exit 1
                fi
              done
              echo "=== All core tools present ==="
            '

  # ── Alpine: verify chezmoi apply succeeds on musl/apk ──────────────────────
  # Alpine uses musl libc + apk; Homebrew is not supported. This job verifies
  # that the bootstrap and core tool install succeed via the apk fallback path.
  alpine:
    name: alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.alpine
          load: true
          tags: dotfiles-alpine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CHEZMOI_BRANCH=${{ github.head_ref || github.ref_name }}

      - name: Verify core tools available on Alpine
        run: |
          docker run --rm dotfiles-alpine:test \
            su - jth -s /bin/sh -c '
              set -e
              echo "=== Verifying Alpine core tools ==="
              for tool in zsh git curl jq fzf bat rg; do
                if command -v "$tool" >/dev/null 2>&1; then
                  echo "✓ $tool ($(command -v $tool))"
                else
                  echo "✗ $tool MISSING" && exit 1
                fi
              done
              echo "=== All core tools present ==="
            '

  # ── Linux aggregator: required status check ─────────────────────────────────
  # Branch protection on `main` requires a status check named `linux`. This job
  # reports success only when every matrix leg AND the distro-specific jobs
  # (alpine, rhel) pass, preserving the contract while letting the matrix and
  # distro list expand independently of branch-protection config.
  linux:
    name: linux
    needs: [profiles, alpine, rhel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all profile and distro legs succeeded
        run: |
          profiles='${{ needs.profiles.result }}'
          alpine='${{ needs.alpine.result }}'
          rhel='${{ needs.rhel.result }}'
          echo "profiles: $profiles  alpine: $alpine  rhel: $rhel"
          if [[ "$profiles" != "success" ]]; then
            echo "::error::At least one profile matrix leg did not succeed (result=$profiles)"
            exit 1
          fi
          if [[ "$alpine" != "success" ]]; then
            echo "::error::Alpine job did not succeed (result=$alpine)"
            exit 1
          fi
          if [[ "$rhel" != "success" ]]; then
            echo "::error::RHEL job did not succeed (result=$rhel)"
            exit 1
          fi

  # ── macOS: Verify chezmoi deploys correctly ─────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Initialize dotfiles (dry run)
        run: |
          # Use the PR branch, not the default branch
          chezmoi init --no-tty --source="$GITHUB_WORKSPACE" --exclude=scripts

      - name: Apply dotfiles (skip scripts to avoid full brew install)
        run: chezmoi apply --no-tty --exclude=scripts

      - name: Verify key files deployed
        run: |
          echo "=== Checking deployed files ==="
          for f in ~/.zshrc ~/.Brewfile ~/.Brewfile.core ~/.p10k.zsh ~/.ssh/config; do
            if [[ -f "$f" ]]; then
              echo "✓ $f"
            else
              echo "✗ $f MISSING" && exit 1
            fi
          done

      - name: Verify templates rendered (no raw {{ in output)
        run: |
          if grep -q '{{' ~/.zshrc; then
            echo "✗ Unrendered template tags in ~/.zshrc"
            grep '{{' ~/.zshrc
            exit 1
          fi
          echo "✓ Templates rendered correctly"

      - name: Verify macOS-specific content present
        run: |
          grep -q "1password" ~/.ssh/config && echo "✓ 1Password SSH agent in config"
          grep -q "/opt/homebrew" ~/.zshrc && echo "✓ Homebrew macOS path in zshrc"

  # ── Nix flake check ─────────────────────────────────────────────────────────
  # Validates nix/flake.nix syntax and evaluates all outputs.
  # Runs on macOS so darwin configurations evaluate correctly.
  # On first run (no nix/flake.lock yet), nix flake lock generates and commits
  # the lockfile back to the PR branch before the check runs.
  nix-flake-check:
    name: nix flake check
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full ref so the auto-commit push targets the correct branch
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@v14

      - name: Lock flake inputs
        run: nix flake lock ./nix

      - name: Commit lockfile if generated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate nix/flake.lock [skip ci]"
          file_pattern: nix/flake.lock

      - name: Check flake
        # --no-build: evaluate all outputs without building derivations.
        # Appropriate for P2 stubs; remove in P3/P4 once outputs produce packages.
        run: nix flake check --no-build ./nix
