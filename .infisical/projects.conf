# Infisical projects served by the agent, one per line.
#
# To add a project, add a line here. No script edits are needed.
#
#   slug        The Infisical project slug. Also names the reader identity
#               (children/<slug>/), the LaunchAgent and the rendered file
#               ~/.infisical/<slug>-secrets.env.
#   envs        Comma-separated environments provision.sh makes sure exist.
#   render-env  The one environment the agent renders into the file.
#   project-id  The Infisical project UUID (not a secret). Use "-" to read it
#               from children/<slug>/project-id, which provision.sh and
#               `provision.sh import` write.
#
# Template: templates/<slug>-secrets.tpl if it exists, otherwise
# templates/_default.tpl, which exports every key in render-env at path "/".
#
# slug          envs        render-env  project-id
backend         dev,prod    prod        -
godocs          dev         dev         -
mcp-servers     dev         dev         -
lav3-vespa      dev         dev         -
